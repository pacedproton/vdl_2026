[package]
name = "vdl_2026"
version = "0.1.0"
edition = "2024"
description = "VDL_2026 - IMPLICIT NONE for kernel concurrency. Modern Vienna Definition Language with explicit state semantics."
authors = ["Vienna Lab Alumni"]
license = "MIT"
keywords = ["formal-methods", "specification", "state-machine", "rcu", "verification", "implicit-none"]
categories = ["development-tools", "science"]

[[bin]]
name = "vdl_2026"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
logos = "0.14"

[dev-dependencies]
pretty_assertions = "1.4"
