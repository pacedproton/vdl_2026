[package]
name = "vdlpp"
version = "0.1.0"
edition = "2024"
description = "VDL++ - A modern successor to the Vienna Definition Language for formal specification and state-space exploration"
authors = ["Vienna Lab Alumni"]
license = "MIT"
keywords = ["formal-methods", "specification", "state-machine", "rcu", "verification"]
categories = ["development-tools", "science"]

[[bin]]
name = "vdlpp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
logos = "0.14"

[dev-dependencies]
pretty_assertions = "1.4"
